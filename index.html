<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دار الفجر - الجدول الأسبوعي وإدارة القاعات</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Tajawal -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #f8fafc;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>

<body class="text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- TOP HEADER & CONTROLS -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-[1800px] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">

      <!-- Brand Title -->
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-extrabold text-xl shadow-sm">
          ف
        </div>
        <div>
          <h1 class="text-lg font-extrabold text-slate-900 leading-tight">دار الفجر</h1>
          <p class="text-xs text-slate-500 font-medium" id="sync-status">جاري التهيئة...</p>
        </div>
      </div>

      <!-- Main Track Toggle (Boys / Girls / All) -->
      <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
        <button type="button" id="track-Boys"
          class="track-btn px-5 py-1.5 rounded-lg text-sm font-bold transition-all">
          البنين
        </button>
        <button type="button" id="track-Girls"
          class="track-btn px-5 py-1.5 rounded-lg text-sm font-bold transition-all">
          البنات
        </button>
        <button type="button" id="track-All"
          class="track-btn px-5 py-1.5 rounded-lg text-sm font-bold transition-all">
          الكل (للمقارنة)
        </button>
      </div>

      <!-- View Switcher & Conflict Alert -->
      <div class="flex items-center gap-2">
        <button type="button" id="conflict-badge"
          class="hidden items-center gap-1.5 bg-red-50 border border-red-300 text-red-700 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-red-100 transition">
          <span>⚠️</span>
          <span id="conflict-count">0 تعارضات</span>
        </button>

        <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
          <button type="button" id="view-weekly"
            class="view-btn px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all">
            📅 الجدول الأسبوعي
          </button>
          <button type="button" id="view-rooms"
            class="view-btn px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all">
            🚪 إشغال القاعات
          </button>
        </div>

        <button type="button" id="refresh-btn" title="تحديث البيانات"
          class="p-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 text-sm font-bold transition">
          🔄
        </button>
      </div>

    </div>

    <!-- FILTER BAR -->
    <div class="bg-slate-50/80 border-t border-slate-200/80">
      <div class="max-w-[1800px] mx-auto px-4 py-2.5 flex flex-wrap items-center gap-3">

        <!-- Search Input -->
        <div class="relative flex-1 min-w-[200px]">
          <input type="text" id="filter-search"
            placeholder="بحث باسم المجموعة، المعلم، أو القاعة..."
            class="w-full pl-3 pr-9 py-1.5 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" />
          <span class="absolute right-3 top-2 text-slate-400 text-sm">🔍</span>
        </div>

        <!-- Category Filter -->
        <select id="filter-category"
          class="bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <option value="All">كل التصنيفات</option>
        </select>

        <!-- Teacher Filter -->
        <select id="filter-teacher"
          class="bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <option value="All">كل المعلمين</option>
        </select>

        <!-- Room Filter -->
        <select id="filter-room"
          class="bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <option value="All">كل القاعات</option>
        </select>

        <!-- Day Selector (Shown only in Room Matrix View) -->
        <select id="filter-matrix-day"
          class="hidden bg-emerald-50 border border-emerald-300 text-emerald-900 rounded-lg px-3 py-1.5 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <option value="Sunday">يوم الأحد</option>
          <option value="Monday">يوم الإثنين</option>
          <option value="Tuesday">يوم الثلاثاء</option>
          <option value="Wednesday">يوم الأربعاء</option>
          <option value="Thursday">يوم الخميس</option>
          <option value="Friday">يوم الجمعة</option>
          <option value="Saturday">يوم السبت</option>
        </select>

        <!-- Reset Button -->
        <button type="button" id="reset-filters-btn"
          class="text-xs font-bold text-slate-500 hover:text-slate-800 px-2 py-1">
          إعادة ضبط ✕
        </button>

        <!-- Stats Pill -->
        <div class="mr-auto text-xs font-bold text-slate-500 bg-slate-200/70 px-3 py-1 rounded-full" id="stats-counter">
          0 حلقات
        </div>

      </div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="max-w-[1800px] w-full mx-auto p-4 flex-1">

    <!-- Category Legend & Masjid Note -->
    <div class="flex flex-wrap items-center justify-between gap-2 mb-4 text-xs">
      <div class="flex flex-wrap items-center gap-3">
        <span class="font-bold text-slate-500">دليل التصنيفات:</span>
        <span
          class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 font-bold border border-emerald-300">
          <span class="w-2 h-2 rounded-full bg-emerald-600"></span> حفظ (Hifz)
        </span>
        <span
          class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-sky-100 text-sky-800 font-bold border border-sky-300">
          <span class="w-2 h-2 rounded-full bg-sky-600"></span> تلاوة / قراءة (Reading)
        </span>
        <span
          class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 font-bold border border-amber-300">
          <span class="w-2 h-2 rounded-full bg-amber-500"></span> قاعدة نورانية (Qaidah)
        </span>
        <span
          class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-purple-100 text-purple-800 font-bold border border-purple-300">
          <span class="w-2 h-2 rounded-full bg-purple-600"></span> تربوي (Tarbawi)
        </span>
      </div>
      <div class="text-slate-500 font-medium bg-white px-3 py-1 rounded-lg border border-slate-200">
        🕌 <strong>المسجد:</strong> يسمح بتعدد الحلقات في نفس الوقت دون احتساب تعارض مكاني
      </div>
    </div>

    <!-- DYNAMIC VIEW CONTAINER -->
    <div id="app-Canvas"></div>

  </main>

  <!-- TIME-SLOT OVERFLOW MODAL ("VIEW MORE") -->
  <div id="slot-modal"
    class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div
      class="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-4xl w-full max-h-[85vh] flex flex-col overflow-hidden">

      <!-- Modal Header -->
      <div class="bg-slate-800 text-white px-5 py-3.5 flex items-center justify-between">
        <div>
          <h3 id="modal-title" class="font-extrabold text-base">حلقات الفترة</h3>
          <p id="modal-subtitle" class="text-xs text-slate-300 font-medium mt-0.5"></p>
        </div>
        <button type="button" id="modal-close-btn"
          class="w-8 h-8 rounded-lg bg-slate-700 hover:bg-slate-600 flex items-center justify-center text-white font-bold transition">
          ✕
        </button>
      </div>

      <!-- Modal Quick Filter -->
      <div class="p-3 bg-slate-50 border-b border-slate-200 flex items-center gap-3">
        <input type="text" id="modal-search"
          placeholder="ابحث داخل هذه الفترة (اسم المجموعة، المعلم، أو القاعة)..."
          class="w-full px-3 py-1.5 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" />
      </div>

      <!-- Modal Body (Grid of Cards) -->
      <div id="modal-body"
        class="p-4 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 bg-slate-100/60">
      </div>

    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>

</html>
